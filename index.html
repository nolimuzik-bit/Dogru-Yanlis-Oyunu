<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background-color: #eaf6ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
}

.true {
    background-color: #4CAF50;
}

.false {
    background-color: #f44336;
}

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* Video overlay için */
.video-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.video-overlay iframe {
    width: 90%;
    max-width: 560px;
    height: 50%;
    max-height: 315px;
}
</style>
</head>

<body>

<div class="container">
    <img id="image" src="img1.jpg">
    
    <div class="buttons">
        <button class="true" onclick="check(true)">😊</button>
        <button class="false" onclick="check(false)">😟</button>
    </div>

    <div id="feedback"></div>
</div>

<!-- YouTube Player API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
// Oyun verileri
const scenes = [true, false, true, false, true, true, true, false, true, false];
let index = 0;
let correctCount = 0;

const feedback = document.getElementById("feedback");

// Cevabı kontrol et
function check(choice) {
    if (choice === scenes[index]) {
        feedback.textContent = "👏";
        correctCount++;
    } else {
        feedback.textContent = "🤔";
    }

    setTimeout(() => {
        feedback.textContent = "";
        index++;
        if (index < scenes.length) {
            document.getElementById("image").src = `img${index + 1}.jpg`;
        } else {
            endGame();
        }
    }, 1200);
}

// Oyun bittiğinde mesaj + Video İzle + Tekrar Oyna
function endGame() {
    const container = document.querySelector(".container");
    const image = container.querySelector("#image");
    const buttons = container.querySelector(".buttons");

    // Resim ve seçim butonlarını gizle
    image.style.display = "none";
    buttons.style.display = "none";
    feedback.textContent = "";

    const message = document.createElement("div");
    message.id = "endMessage";

    const total = scenes.length;
    const ratio = correctCount / total;

    if (ratio >= 0.6) {
        message.innerHTML = `
            <h2>🎉🎉 BRAVO 🎉🎉</h2>
            <p>Harika düşündün!</p>
            <p>👏👏👏</p>
        `;
    } else {
        message.innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>Birlikte tekrar deneyelim mi?</p>
        `;
    }

    // Butonlar: Video İzle + Tekrar Oyna
    message.innerHTML += `
        <div style="margin-top:20px; display:flex; justify-content:space-around;">
            <button id="watchVideoBtn" style="font-size:16px; padding:8px 12px;">▶️ Video İzle</button>
            <button onclick="restartGame()" style="font-size:16px; padding:8px 12px;">🔄 Tekrar Oyna</button>
        </div>
    `;

    container.appendChild(message);

    // Video butonuna tıklanınca YouTube videoyu göster
    document.getElementById("watchVideoBtn").addEventListener("click", () => {
        const videoOverlay = document.createElement("div");
        videoOverlay.className = "video-overlay";

        const iframe = document.createElement("div");
        iframe.id = "ytplayer";
        videoOverlay.appendChild(iframe);

        document.body.appendChild(videoOverlay);

        
        const VIDEO_ID = "QEubvr-ji74";

        // YouTube player oluştur
        const player = new YT.Player('ytplayer', {
            height: '315',
            width: '560',
            videoId: VIDEO_ID,
            events: {
                'onReady': (event) => { event.target.playVideo(); },
                'onStateChange': (event) => {
                    // Video bittiğinde overlayi kapat
                    if (event.data === YT.PlayerState.ENDED) {
                        document.body.removeChild(videoOverlay);
                    }
                }
            }
        });

        // Overlay tıklayınca kapansın
        videoOverlay.addEventListener("click", (e) => {
            if (e.target === videoOverlay) {
                document.body.removeChild(videoOverlay);
            }
        });
    });
}

// Oyunu yeniden başlat
function restartGame() {
    index = 0;
    correctCount = 0;

    const container = document.querySelector(".container");
    container.querySelector("#image").style.display = "block";
    container.querySelector(".buttons").style.display = "flex";

    document.getElementById("image").src = "img1.jpg";
    feedback.textContent = "";

    const endMessage = document.getElementById("endMessage");
    if (endMessage) endMessage.remove();
}
</script>

</body>
</html>
