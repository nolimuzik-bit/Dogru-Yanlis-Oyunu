<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>
<style>
body {
    background-color: #eaf6ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    position: relative;
    overflow-x: hidden;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    position: relative;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
}

.true { background-color: #4CAF50; }
.false { background-color: #f44336; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* Konfeti animasyonu */
@keyframes confetti {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
}
.confetti {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    top: 0;
    animation: confetti 1.5s linear forwards;
}
</style>
</head>
<body>

<div class="container">
    <img id="image" src="img1.jpg">
    
    <div class="buttons">
        <button class="true" onclick="check(true)">😊</button>
        <button class="false" onclick="check(false)">😟</button>
    </div>

    <div id="feedback"></div>
</div>

<!-- Sesler -->
<audio id="soundCorrect" src="alkis.mp3"></audio>
<audio id="soundWrong" src="dusun.mp3"></audio>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const scenes = [
        true, false, true, false, true,
        true, true, false, true, false
    ];

    let index = 0;
    let correctCount = 0;

    const feedback = document.getElementById("feedback");
    const correctSound = document.getElementById("soundCorrect");
    const wrongSound = document.getElementById("soundWrong");

    function check(choice) {
        if (choice === scenes[index]) {
            feedback.textContent = "👏";
            if (correctSound) { correctSound.currentTime = 0; correctSound.play(); }
            correctCount++;
        } else {
            feedback.textContent = "🤔";
            if (wrongSound) { wrongSound.currentTime = 0; wrongSound.play(); }
        }

        setTimeout(() => {
            feedback.textContent = "";
            index++;
            if (index < scenes.length) {
                document.getElementById("image").src = `img${index + 1}.jpg`;
            } else {
                endGame();
            }
        }, 1200);
    }

    function createConfetti() {
        for (let i = 0; i < 25; i++) {
            const confetti = document.createElement("div");
            confetti.className = "confetti";
            confetti.style.left = Math.random() * 100 + "%";
            confetti.style.backgroundColor = ["red","blue","green","yellow","pink"][Math.floor(Math.random()*5)];
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 2000);
        }
    }

    function endGame() {
        const ratio = correctCount / scenes.length;
        const container = document.querySelector(".container");
        const image = container.querySelector("#image");
        const buttons = container.querySelector(".buttons");

        // Resim ve butonları gizle
        image.style.display = "none";
        buttons.style.display = "none";
        feedback.textContent = "";

        const message = document.createElement("div");
        message.id = "endMessage";

        if (ratio >= 0.6) {
            createConfetti(); // Konfeti animasyonu
            if (correctSound) { correctSound.currentTime = 0; correctSound.play(); }
            message.innerHTML = `
                <h2>🎉🎉 BRAVO 🎉🎉</h2>
                <p>Harika düşündün!</p>
                <p>👏👏👏</p>
                <button onclick="restartGame()" style="font-size:18px;">🔄 Yeniden Oyna</button>
            `;
        } else {
            message.innerHTML = `
                <h2>🌱 Güzel denedin</h2>
                <p>Birlikte tekrar deneyelim mi?</p>
                <button onclick="restartGame()" style="font-size:18px;">🔄 Tekrar Dene</button>
            `;
        }

        container.appendChild(message);
    }

    function restartGame() {
        const container = document.querySelector(".container");
        const endMessage = document.getElementById("endMessage");
        if (endMessage) container.removeChild(endMessage);

        container.querySelector("#image").style.display = "block";
        container.querySelector(".buttons").style.display = "flex";

        document.getElementById("image").src = "img1.jpg";
        index = 0;
        correctCount = 0;
        feedback.textContent = "";
    }

    // Fonksiyonları global yap
    window.check = check;
    window.restartGame = restartGame;
});
</script>

</body>
</html>
