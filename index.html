<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background-color: #eaf6ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 420px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
}

.true { background-color: #4CAF50; }
.false { background-color: #f44336; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}
</style>
</head>

<body>

<!-- BAŞLANGIÇ EKRANI -->
<div id="startScreen" class="container">
    <h2>👋 Yetişkinler için</h2>
    <p>
        Çocuğunuza resmi gösterin ve<br>
        <strong>“Sence bu davranış doğru mu?”</strong> diye sorun.<br><br>
        😊 Doğruysa yeşil butona<br>
        😟 Yanlışsa kırmızı butona basmasını isteyin.
    </p>
    <button onclick="startGame()" style="font-size:20px; padding:10px 20px;">
        ▶️ Başla
    </button>
</div>

<!-- OYUN EKRANI -->
<div id="gameScreen" class="container" style="display:none;">
    <img id="image" src="img1.jpg">

    <div class="buttons">
        <button class="true" onclick="check(true)">😊</button>
        <button class="false" onclick="check(false)">😟</button>
    </div>

    <div id="feedback"></div>
</div>

<!-- SESLER -->
<audio id="soundCorrect" src="alkis.mp3"></audio>
<audio id="soundWrong" src="dusun.mp3"></audio>

<script>
const scenes = [
    true, false, true, false, true,
    true, true, false, true, false
];

let index = 0;
let correctCount = 0;
function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
}

function check(choice) {
    const feedback = document.getElementById("feedback");
    const correctSound = document.getElementById("soundCorrect");
    const wrongSound = document.getElementById("soundWrong");

    if (choice === scenes[index]) {
        feedback.textContent = "👏";
        correctSound.currentTime = 0;
        correctSound.play();
    } else {
        feedback.textContent = "🤔";
        wrongSound.currentTime = 0;
        wrongSound.play();
        correctCount++;

    }

    setTimeout(() => {
        feedback.textContent = "";
        index++;

        if (index < scenes.length) {
            document.getElementById("image").src = `img${index + 1}.jpg`;
        } else {
            endGame();
        }
    }, 1200);
}

function endGame() {
    const total = scenes.length;
    const ratio = correctCount / total;

    if (ratio >= 0.6) {
        document.querySelector(".container").innerHTML = `
            <h2>🎉🎉 BRAVO 🎉🎉</h2>
            <p>Harika düşündün!</p>
            <p>👏👏👏</p>
            <button onclick="restartGame()" style="font-size:18px;">
                🔄 Yeniden Oyna
            </button>
        `;
    } else {
        document.querySelector(".container").innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>Birlikte tekrar deneyelim mi?</p>
            <button onclick="restartGame()" style="font-size:18px;">
                🔄 Tekrar Dene
            </button>
        `;
    }
}

function restartGame() {
    
    location.reload();
}
</script>

</body>
</html>
