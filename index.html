<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background: linear-gradient(180deg,#eaf6ff,#ffffff);
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    text-align: center;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 20px;
    cursor: pointer;
    padding: 12px 16px;
    font-size: 16px;
}

.big-btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border-radius: 50%;
}

.true { background-color: #4CAF50; color:white; }
.false { background-color: #f44336; color:white; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* BAŞLANGIÇ EKRANI */
.start {
    margin-top: 20px;
}

.start h2 {
    color:#2196f3;
    font-size: 26px;
    margin-bottom: 15px;
}

.start .card {
    background: #f0f8ff;
    border-radius: 16px;
    padding: 18px;
    margin: 20px 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.start p {
    font-size: 17px;
    line-height: 1.7;
}

.start .icons {
    font-size: 22px;
    margin-top: 12px;
}

.start .start-btn {
    margin-top: 25px;
    font-size: 22px;
    padding: 14px 28px;
    background: #2196f3;
    color: white;
    border-radius: 30px;
}

/* video */
.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
</style>
</head>

<body>

<!-- 🔊 SESLER -->
<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>
<audio id="dingSound" src="ding.mp3"></audio>

<div class="container" id="app">

    <!-- BAŞLANGIÇ -->
    <div class="start" id="startScreen">
        <h2>👋 Yetişkinler için</h2>

        <div class="card">
            <p>
                Çocuğunuza resmi gösterin ve<br>
                <strong>“Sence bu davranış doğru mu?”</strong><br>
                diye sorun.
            </p>

            <div class="icons">
                😊 Doğruysa <strong>yeşil</strong><br>
                😟 Yanlışsa <strong>kırmızı</strong>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()">
            ▶️ Oyuna Başla
        </button>
    </div>

    <!-- OYUN -->
    <div id="gameScreen" style="display:none;">
        <img id="image" src="img1.jpg">
        <div class="buttons">
            <button class="big-btn true" onclick="check(true)">😊</button>
            <button class="big-btn false" onclick="check(false)">😟</button>
        </div>
        <div id="feedback"></div>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const scenes = [true,false,true,false,true,true,true,false,true,false];
let index = 0;
let correctCount = 0;
let audioUnlocked = false;

const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");
const dingSound  = document.getElementById("dingSound");
const feedback = document.getElementById("feedback");
const image = document.getElementById("image");

function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [clapSound,wrongSound,dingSound].forEach(s=>{
        s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});
    });
}

function startGame(){
    unlockAudio();
    dingSound.play();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";
}

function check(choice){
    unlockAudio();

    if(choice === scenes[index]){
        feedback.textContent="👏";
        clapSound.currentTime=0;
        clapSound.play();
        correctCount++;
    }else{
        feedback.textContent="🤔";
        wrongSound.currentTime=0;
        wrongSound.play();
    }

    setTimeout(()=>{
        feedback.textContent="";
        index++;
        if(index < scenes.length){
            image.src=`img${index+1}.jpg`;
        }else{
            endGame();
        }
    },1200);
}

function endGame(){
    const app = document.getElementById("app");
    const ratio = correctCount / scenes.length;

    app.innerHTML = "";

    if(ratio >= 0.6){
        app.innerHTML = `
            <h2>🎉 AFERİN 🎉</h2>
            <p>Harika düşündün!</p>
            <p>👏👏👏</p>
            <div style="display:flex;justify-content:space-around;margin-top:20px;">
                <button onclick="showVideo()">▶️ Video İzle</button>
                <button onclick="restartGame()">🔄 Tekrar Oyna</button>
            </div>
        `;
        clapSound.play();
    }else{
        app.innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>
                Biraz daha denersen<br>
                <strong>video sürprizi</strong> seni bekliyor 🎁
            </p>
            <div style="margin-top:20px;">
                <button onclick="restartGame()">🔄 Tekrar Dene</button>
            </div>
        `;
    }
}

function showVideo(){
    const overlay=document.createElement("div");
    overlay.className="video-overlay";
    overlay.innerHTML=`<div id="ytplayer"></div>`;
    document.body.appendChild(overlay);

    const VIDEO_ID = "QEubvr-ji74"; // 👈 SADECE BURAYI DEĞİŞTİR

    new YT.Player("ytplayer",{
        videoId:VIDEO_ID,
        events:{
            onReady:e=>e.target.playVideo(),
            onStateChange:e=>{
                if(e.data===YT.PlayerState.ENDED){
                    document.body.removeChild(overlay);
                }
            }
        }
    });
}

function restartGame(){
    index=0;
    correctCount=0;
    location.reload();
}
</script>

</body>
</html>
