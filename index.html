<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background: linear-gradient(180deg,#eaf6ff,#ffffff);
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    text-align: center;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 20px;
    cursor: pointer;
    padding: 14px 20px;
    font-size: 18px;
}

.big-btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border-radius: 50%;
}

.true { background-color: #4CAF50; color:white; }
.false { background-color: #f44336; color:white; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* BAŞLANGIÇ */
.start {
    background: linear-gradient(180deg,#dff5ea,#f4fffa);
    border-radius: 20px;
    padding: 30px 20px;
}

.start h2 {
    color:#2e7d6b;
    font-size: 26px;
    margin-bottom: 15px;
}

.start .card {
    background: rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 18px;
    margin: 20px 0;
}

.start p {
    font-size: 17px;
    line-height: 1.7;
}

.start .icons {
    font-size: 22px;
    margin-top: 12px;
}

.start .start-btn {
    margin-top: 25px;
    font-size: 24px;
    padding: 16px 32px;
    background: #ff9800;
    color: white;
    border-radius: 35px;
}

/* KONFETİ */
.confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}
.confetti span {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    animation: fall 3s linear infinite;
}
@keyframes fall {
    0% { transform: translateY(-10px) rotate(0); }
    100% { transform: translateY(100vh) rotate(360deg); }
}

/* VIDEO */
.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
</style>
</head>

<body>

<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>
<audio id="dingSound" src="ding.mp3"></audio>

<div class="container" id="app">

    <div class="start" id="startScreen">
        <h2>👋 Yetişkinler için</h2>

        <div class="card">
            <p>
                Çocuğunuza resmi gösterin ve<br>
                <strong>“Sence bu davranış doğru mu?”</strong><br>
                diye sorun.
            </p>
            <div class="icons">
                😊 Doğruysa <strong>yeşil</strong><br>
                😟 Yanlışsa <strong>kırmızı</strong>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()">▶️ Oyuna Başla</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <img id="image" src="img1.jpg">
        <div class="buttons">
            <button class="big-btn true" onclick="check(true)">😊</button>
            <button class="big-btn false" onclick="check(false)">😟</button>
        </div>
        <div id="feedback"></div>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const scenes=[true,false,true,false,true,true,true,false,true,false];
let index=0, correctCount=0, audioUnlocked=false;

const clapSound=document.getElementById("clapSound");
const wrongSound=document.getElementById("wrongSound");
const dingSound=document.getElementById("dingSound");
const feedback=document.getElementById("feedback");
const image=document.getElementById("image");

function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked=true;
    [clapSound,wrongSound,dingSound].forEach(s=>{
        s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});
    });
}

function startGame(){
    unlockAudio();
    dingSound.play();
    startScreen.style.display="none";
    gameScreen.style.display="block";
}

function check(choice){
    unlockAudio();
    if(choice===scenes[index]){
        feedback.textContent="👏";
        clapSound.play();
        correctCount++;
    }else{
        feedback.textContent="🤔";
        wrongSound.play();
    }
    setTimeout(()=>{
        feedback.textContent="";
        index++;
        if(index<scenes.length){
            image.src=`img${index+1}.jpg`;
        }else endGame();
    },1200);
}

function endGame(){
    const app=document.getElementById("app");
    const ratio=correctCount/scenes.length;
    app.innerHTML="";

    if(ratio>=0.6){
        createConfetti();
        app.innerHTML=`
            <h2>🎉 AFERİN 🎉</h2>
            <p>Harika düşündün!</p>
            <div style="display:flex;justify-content:space-around;margin-top:30px;">
                <button style="font-size:22px;" onclick="showVideo()">▶️ Video İzle</button>
                <button style="font-size:22px;" onclick="restartGame()">🔄 Tekrar Oyna</button>
            </div>`;
        clapSound.play();
    }else{
        app.innerHTML=`
            <h2>🌱 Güzel denedin</h2>
            <p>Biraz daha denersen <strong>video sürprizi</strong> var 🎁</p>
            <button style="font-size:22px;" onclick="restartGame()">🔄 Tekrar Dene</button>`;
    }
}

function createConfetti(){
    const c=document.createElement("div");
    c.className="confetti";
    for(let i=0;i<80;i++){
        const s=document.createElement("span");
        s.style.left=Math.random()*100+"%";
        s.style.background=`hsl(${Math.random()*360},80%,60%)`;
        s.style.animationDelay=Math.random()*3+"s";
        c.appendChild(s);
    }
    document.body.appendChild(c);
}

function showVideo(){
    const o=document.createElement("div");
    o.className="video-overlay";
    o.innerHTML=`<div id="ytplayer"></div>`;
    document.body.appendChild(o);
    new YT.Player("ytplayer",{videoId:"QEubvr-ji74"});
}

function restartGame(){ location.reload(); }
</script>

</body>
</html>
