
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body{
    background:#eaf6ff;
    font-family:Arial,sans-serif;
    margin:0;
    text-align:center;
}
.container{
    max-width:420px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
}
img{width:100%;border-radius:15px}
.buttons{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
}
button{
    cursor:pointer;
    border:none;
}
.true,.false{
    width:120px;
    height:120px;
    font-size:40px;
    border-radius:50%;
}
.true{background:#4CAF50}
.false{background:#f44336}
#feedback{font-size:50px;margin-top:15px}

.start{
    background:linear-gradient(#ffecd2,#fcb69f);
}
.start h2{margin-bottom:10px}
.start p{font-size:18px;line-height:1.6}
.start button{
    font-size:22px;
    padding:12px 30px;
    border-radius:30px;
    background:#ff9800;
    color:white;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}
</style>
</head>

<body>

<!-- 🔊 SESLER -->
<audio id="dingSound" src="ding.mp3"></audio>
<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>

<!-- 🌈 BAŞLANGIÇ -->
<div class="container start" id="startScreen">
    <h2>👋 Yetişkinler için</h2>
    <p>
        Çocuğunuza resmi gösterin ve<br>
        <strong>“Sence bu davranış doğru mu?”</strong> diye sorun.<br><br>
        😊 Doğruysa yeşil buton<br>
        😟 Yanlışsa kırmızı buton
    </p>
    <button onclick="startGame()">▶️ Başla</button>
</div>

<!-- 🎮 OYUN -->
<div class="container" id="gameScreen" style="display:none">
    <img id="image" src="img1.jpg">
    <div class="buttons">
        <button class="true" onclick="check(true)">😊</button>
        <button class="false" onclick="check(false)">😟</button>
    </div>
    <div id="feedback"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const scenes=[true,false,true,false,true,true,true,false,true,false];
let index=0,correct=0;

const ding=dingSound,clap=clapSound,wrong=wrongSound;

function startGame(){
    ding.play();
    startScreen.style.display="none";
    gameScreen.style.display="flex";
}

function check(choice){
    if(choice===scenes[index]){
        feedback.textContent="👏";
        clap.play();
        correct++;
    }else{
        feedback.textContent="🤔";
        wrong.play();
    }

    setTimeout(()=>{
        feedback.textContent="";
        index++;
        if(index<scenes.length){
            image.src=`img${index+1}.jpg`;
        }else{
            endGame();
        }
    },1200);
}

function endGame(){
    gameScreen.innerHTML="";
    const ratio=correct/scenes.length;
    let stars="⭐".repeat(Math.round(ratio*5));

    if(ratio>=0.6){
        gameScreen.innerHTML=`
        <h2>🌟 AFERİN 🌟</h2>
        <p>${stars}</p>
        <button onclick="showVideo()">🎬 Video İzle</button><br><br>
        <button onclick="restart()">🔄 Tekrar Oyna</button>`;
    }else{
        gameScreen.innerHTML=`
        <h2>🌱 Güzel denedin</h2>
        <p>Daha çok bilirsen bir <b>video sürprizi</b> var 🎁</p>
        <button onclick="restart()">🔄 Tekrar Dene</button>`;
    }
}

function showVideo(){
    const overlay=document.createElement("div");
    overlay.className="video-overlay";
    overlay.innerHTML=`<div id="ytplayer"></div>`;
    document.body.appendChild(overlay);

    new YT.Player("ytplayer",{
        videoId:"QEubvr-ji74", // 👈 SADECE BURAYI DEĞİŞTİR
        events:{
            onReady:e=>e.target.playVideo(),
            onStateChange:e=>{
                if(e.data===YT.PlayerState.ENDED){
                    document.body.removeChild(overlay);
                }
            }
        }
    });
}

function restart(){
    index=0;correct=0;
    gameScreen.style.display="none";
    startScreen.style.display="flex";
}
</script>

</body>
</html>
