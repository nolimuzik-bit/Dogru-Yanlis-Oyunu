<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background: linear-gradient(180deg,#e6fff2,#ffffff);
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 25px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    #startScreen {
    background: #ffe6ee; /* açık pembe */
    border-radius: 20px;
    padding: 25px;
}
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 20px;
    cursor: pointer;
    padding: 12px 18px;
    font-size: 18px;
}

.big-btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border-radius: 50%;
}

.true { background-color: #4CAF50; color:white; }
.false { background-color: #f44336; color:white; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* başlangıç */
.start h2 {
    color:#1976d2;
    font-size:26px;
    margin-bottom:10px;
}
.start p {
    line-height:1.7;
    font-size:18px;
    margin-bottom:20px;
}

/* video */
.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

/* konfeti */
.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    opacity: 0.9;
    z-index: 2000;
    animation-name: confettiFall;
    animation-timing-function: linear;
}

@keyframes confettiFall {
    0% {
        transform: translateX(0) rotate(0deg);
        top: -20px;
    }
    25% {
        transform: translateX(20px) rotate(90deg);
    }
    50% {
        transform: translateX(-20px) rotate(180deg);
    }
    75% {
        transform: translateX(15px) rotate(270deg);
    }
    100% {
        transform: translateX(-15px) rotate(360deg);
        top: 110vh;
    }
}
}

</style>
</head>

<body>

<!-- 🔊 SESLER -->
<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>
<audio id="dingSound" src="ding.mp3"></audio>

<div class="container" id="app">

    <!-- BAŞLANGIÇ -->
    <div class="start" id="startScreen">
        <h2>👋 Yetişkinler için</h2>
        <p>
            Resmi gösterin ve çocuğunuza<br>
            <strong>“Sence bu davranış doğru mu?”</strong> diye sorun.<br><br>
            😊 Doğruysa yeşil<br>
            😟 Yanlışsa kırmızı buton
        </p>
        <button onclick="startGame()" 
style="
margin-top:25px;
font-size:22px;
background:#ff9800;
color:white;
padding:14px 30px;
border-radius:30px;
">
▶️ Başla
</button>
    </div>

    <!-- OYUN -->
    <div id="gameScreen" style="display:none;">
        <img id="image" src="img1.jpg">
        <div class="buttons">
            <button class="big-btn true" onclick="check(true)">😊</button>
            <button class="big-btn false" onclick="check(false)">😟</button>
        </div>
        <div id="feedback"></div>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const scenes = [true,false,true,false,true,true,true,false,true,false];
let index = 0;
let correctCount = 0;
let audioUnlocked = false;
let lastRatio = 0;

const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");
const dingSound  = document.getElementById("dingSound");
const feedback = document.getElementById("feedback");
const image = document.getElementById("image");

function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [clapSound,wrongSound,dingSound].forEach(s=>{
        s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});
    });
}

function startGame(){
    unlockAudio();
    dingSound.play();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";
}

function check(choice){
    unlockAudio();

    if(choice === scenes[index]){
        feedback.textContent="👏";
        clapSound.currentTime=0;
        clapSound.play();
        correctCount++;
    }else{
        feedback.textContent="🤔";
        wrongSound.currentTime=0;
        wrongSound.play();
    }

    setTimeout(()=>{
        feedback.textContent="";
        index++;
        if(index < scenes.length){
            image.src=`img${index+1}.jpg`;
        }else{
            endGame();
        }
    },1200);
}

function confetti(){
    for(let i=0;i<40;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),3000);
    }
}

function endGame(){
    const app = document.getElementById("app");
    lastRatio = correctCount / scenes.length;
    app.innerHTML = "";

    if(lastRatio >= 0.6){
        confetti();
        clapSound.play();
        app.innerHTML = `
            <h2>🎉 AFERİN 🎉</h2>
            <p>Harika düşündün ⭐⭐⭐</p>
            <div style="display:flex;justify-content:space-around;margin-top:25px;">
                <button onclick="showVideo()">▶️ Video İzle</button>
                <button onclick="restartGame()">🔄 Tekrar Oyna</button>
            </div>
        `;
    }else{
        app.innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>
                Bir daha dene bakalım 🌈<br>
                <strong>Daha çok bilirsen video sürprizi var 🎁</strong>
            </p>
            <button onclick="restartGame()">🔄 Tekrar Dene</button>
        `;
    }
}

function showVideo(){
    const overlay = document.createElement("div");
    overlay.className = "video-overlay";
    overlay.innerHTML = `<div id="ytplayer"></div>`;
    document.body.appendChild(overlay);

    const VIDEO_ID = "QEubvr-ji74"; // 👈 sadece burayı değiştirirsin

    new YT.Player("ytplayer",{
        videoId: VIDEO_ID,
        playerVars:{ autoplay:1 },
        events:{
            onStateChange:e=>{
                if(e.data===YT.PlayerState.ENDED){
                    document.body.removeChild(overlay);
                    endGame();
                }
            }
        }
    });
}

function restartGame(){
    location.reload();
}
</script>

</body>
</html>
