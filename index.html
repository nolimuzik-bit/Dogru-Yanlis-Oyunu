<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background: linear-gradient(180deg,#eaf6ff,#ffffff);
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 20px;
    cursor: pointer;
    padding: 12px 16px;
    font-size: 18px;
}

.big-btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border-radius: 50%;
}

.true { background-color: #4CAF50; color:white; }
.false { background-color: #f44336; color:white; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

/* BAŞLANGIÇ EKRANI */
#startScreen {
    background: #ffe6ee; /* Açık pembe */
    border-radius: 20px;
    padding: 25px;
}

.start h2 {
    color:#2196f3;
    font-size:26px;
    margin-top:-20px;
}

.start p {
    line-height:1.7;
    font-size:18px;
}

.start button {
    margin-top:25px;
    font-size:22px;
    background:#ff9800;
    color:white;
    padding:14px 30px;
    border-radius:30px;
}

/* video */
.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

/* CONFETTI */
.confetti {
    position: fixed;
    top: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    z-index: 9999;
    pointer-events: none;
    animation-name: fall, spin;
    animation-timing-function: linear;
}

@keyframes fall {
    0% { transform: translateY(0); }
    100% { transform: translateY(100vh); }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- 🔊 SESLER -->
<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>
<audio id="dingSound" src="ding.mp3"></audio>

<div class="container" id="app">

    <!-- BAŞLANGIÇ -->
    <div class="start" id="startScreen">
        <h2>👋 Yetişkinler için</h2>
        <p>
            Çocuğunuza resmi gösterin ve<br>
            <strong>“Sence bu davranış doğru mu?”</strong> diye sorun.<br><br>
            😊 Doğruysa yeşil buton<br>
            😟 Yanlışsa kırmızı buton
        </p>
        <button onclick="startGame()">▶️ Başla</button>
    </div>

    <!-- OYUN -->
    <div id="gameScreen" style="display:none;">
        <img id="image" src="img1.jpg">
        <div class="buttons">
            <button class="big-btn true" onclick="check(true)">😊</button>
            <button class="big-btn false" onclick="check(false)">😟</button>
        </div>
        <div id="feedback"></div>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const scenes = [true,false,true,false,true,true,true,false,true,false];
let index = 0;
let correctCount = 0;
let audioUnlocked = false;
let ytPlayer = null;

const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");
const dingSound  = document.getElementById("dingSound");
const feedback = document.getElementById("feedback");
const image = document.getElementById("image");

function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [clapSound,wrongSound,dingSound].forEach(s=>{
        s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});
    });
}

function startGame(){
    unlockAudio();
    dingSound.play();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";
}

function check(choice){
    unlockAudio();

    if(choice === scenes[index]){
        feedback.textContent="👏";
        clapSound.currentTime=0;
        clapSound.play();
        correctCount++;
    }else{
        feedback.textContent="🤔";
        wrongSound.currentTime=0;
        wrongSound.play();
    }

    setTimeout(()=>{
        feedback.textContent="";
        index++;
        if(index < scenes.length){
            image.src=`img${index+1}.jpg`;
        }else{
            endGame();
        }
    },1200);
}

function startConfetti() {
    for (let i = 0; i < 60; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            ["#ff5252","#ffeb3b","#4caf50","#03a9f4","#e040fb"]
            [Math.floor(Math.random() * 5)];
        confetti.style.animationDuration =
            (3 + Math.random() * 3) + "s";
        confetti.style.animationDelay =
            (Math.random() * 1.5) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 7000);
    }
}

function endGame(){
    const app = document.getElementById("app");
    const ratio = correctCount / scenes.length;

    app.innerHTML = "";

    if(ratio >= 0.6){
        startConfetti();
        app.innerHTML = `
            <h2>🎉 AFERİN 🎉</h2>
            <p>Harika düşündün!</p>
            <p>👏👏👏</p>
            <div style="display:flex;justify-content:space-around;margin-top:20px;">
                <button onclick="showVideo()" style="padding:16px 32px; font-size:20px;">▶️ Video İzle</button>
                <button onclick="restartGame()" style="padding:16px 32px; font-size:20px;">🔄 Tekrar Oyna</button>
            </div>
        `;
        clapSound.play();
    }else{
        app.innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>
                Biraz daha denersen<br>
                <strong>video sürprizi</strong> seni bekliyor 🎁
            </p>
            <div style="margin-top:20px;">
                <button onclick="restartGame()">🔄 Tekrar Dene</button>
            </div>
        `;
    }
}

function showVideo(){
    const overlay = document.createElement("div");
    overlay.className = "video-overlay";
    overlay.innerHTML = `<div id="ytplayer"></div>`;
    document.body.appendChild(overlay);

    const VIDEO_ID = "QEubvr-ji74";

    ytPlayer = new YT.Player("ytplayer",{
        videoId: VIDEO_ID,
        playerVars: { autoplay: 1 },
        events:{
            onReady: e => e.target.playVideo(),
            onStateChange: e => {
                if(e.data === YT.PlayerState.ENDED){
                    ytPlayer.stopVideo();
                    ytPlayer.destroy();
                    ytPlayer = null;
                    document.body.removeChild(overlay);
                    // Sonuç ekranını tekrar göster
                    endGame();
                }
            }
        }
    });
}

function restartGame(){
    location.reload();
}
</script>

</body>
</html>
