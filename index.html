<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğruyu Bul</title>

<style>
body {
    background-color: #eaf6ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

img {
    width: 100%;
    border-radius: 15px;
}

.buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.choice-btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
}

.true { background-color: #4CAF50; }
.false { background-color: #f44336; }

#feedback {
    font-size: 50px;
    margin-top: 15px;
}

.video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
</style>
</head>

<body>

<!-- 🔊 SESLER -->
<audio id="clapSound" src="alkis.mp3"></audio>
<audio id="wrongSound" src="dusun.mp3"></audio>

<div class="container" id="startScreen">
    <h2>👨‍👩‍👧 Büyükler İçin</h2>
    <p style="text-align:left;">
        • Resmi çocuğa gösterin.<br>
        
        • Davranış doğruysa 😊, yanlışsa 😟 işaretlemesini isteyin.<br>
        
        • Amaç doğru–yanlış davranışı ayırt etmeyi desteklemektir.
    </p>
    <button onclick="startGame()">▶️ Oyuna Başla</button>
</div>

<div class="container" id="gameScreen" style="display:none;">
    <img id="image" src="img1.jpg">

    <div class="buttons">
        <button class="choice-btn true" onclick="check(true)">😊</button>
        <button class="choice-btn false" onclick="check(false)">😟</button>
    </div>

    <div id="feedback"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const scenes = [true,false,true,false,true,true,true,false,true,false];
let index = 0;
let correctCount = 0;
let audioUnlocked = false;

const image = document.getElementById("image");
const feedback = document.getElementById("feedback");
const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");

// 🔓 SES KİLİDİ
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;

    clapSound.play().then(()=>{ clapSound.pause(); clapSound.currentTime=0; }).catch(()=>{});
    wrongSound.play().then(()=>{ wrongSound.pause(); wrongSound.currentTime=0; }).catch(()=>{});
}

function startGame() {
    unlockAudio();
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "flex";
}

// CEVAP
function check(choice) {
    unlockAudio();

    if (choice === scenes[index]) {
        feedback.textContent = "👏";
        clapSound.currentTime = 0;
        clapSound.play();
        correctCount++;
    } else {
        feedback.textContent = "🤔";
        wrongSound.currentTime = 0;
        wrongSound.play();
    }

    setTimeout(() => {
        feedback.textContent = "";
        index++;
        if (index < scenes.length) {
            image.src = `img${index+1}.jpg`;
        } else {
            endGame();
        }
    }, 1200);
}

// 🎯 OYUN SONU – KAZANMA KONTROLÜ
function endGame() {
    image.style.display = "none";
    document.querySelector(".buttons").style.display = "none";

    const ratio = correctCount / scenes.length;
    const win = ratio >= 0.6;

    const msg = document.createElement("div");
    msg.id = "endMessage";

    if (win) {
        clapSound.play();
        confetti({ particleCount: 150, spread: 90 });

        msg.innerHTML = `
            <h2>🎉 AFERİN 🎉</h2>
            <p>Harika düşündün!</p>
            <div style="display:flex; justify-content:space-around; margin-top:20px;">
                <button onclick="showVideo()">▶️ Video İzle</button>
                <button onclick="restartGame()">🔄 Tekrar Oyna</button>
            </div>
        `;
    } else {
        msg.innerHTML = `
            <h2>🌱 Güzel denedin</h2>
            <p>
🌟 Biraz daha dene bakalım!<br>
🎁 Daha çok bilirsen sana güzel bir video sürprizi var.
</p>
            <button onclick="restartGame()">🔄 Tekrar Dene</button>
        `;
    }

    document.getElementById("gameScreen").appendChild(msg);
}

// 🎥 VIDEO
function showVideo() {
    const overlay = document.createElement("div");
    overlay.className = "video-overlay";
    overlay.innerHTML = `<div id="ytplayer"></div>`;
    document.body.appendChild(overlay);

    const VIDEO_ID = "QEubvr-ji74"; // 👈 SADECE BURAYI DEĞİŞTİR

    new YT.Player("ytplayer", {
        videoId: VIDEO_ID,
        events: {
            onReady: e => e.target.playVideo(),
            onStateChange: e => {
                if (e.data === YT.PlayerState.ENDED) {
                    document.body.removeChild(overlay);
                }
            }
        }
    });
}

// 🔄 TEKRAR
function restartGame() {
    index = 0;
    correctCount = 0;
    image.style.display = "block";
    document.querySelector(".buttons").style.display = "flex";
    image.src = "img1.jpg";
    document.getElementById("endMessage").remove();
}
</script>

</body>
</html>
